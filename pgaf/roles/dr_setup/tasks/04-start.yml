---
###############################################################################
# Start PostgreSQL
###############################################################################

- name: Start PostgreSQL service
  service:
    name: "{{ postgres_service }}"
    state: started
    enabled: yes

###############################################################################
# Wait for PostgreSQL Port
###############################################################################

- name: Wait for PostgreSQL port
  wait_for:
    host: 127.0.0.1
    port: "{{ postgres_port }}"
    delay: 2
    timeout: 60

###############################################################################
# Wait for PostgreSQL Ready
###############################################################################

- name: Wait for PostgreSQL to accept connections
  become_user: postgres
  shell: |
    {{ postgresql_bin_dir }}/pg_isready \
      -h 127.0.0.1 \
      -p {{ postgres_port }}
  register: pg_ready
  retries: 30
  delay: 2
  until: pg_ready.rc == 0
  changed_when: false

###############################################################################
# Verify PostgreSQL Process
###############################################################################

- name: Verify PostgreSQL process
  shell: |
    pgrep -fa postgres
  register: postgres_process
  changed_when: false

- name: Display PostgreSQL processes
  debug:
    var: postgres_process.stdout_lines

###############################################################################
# Display Startup Summary
###############################################################################

- name: Display startup summary
  debug:
    msg:
      - "PostgreSQL Service : Started"
      - "PostgreSQL Port    : {{ postgres_port }}"
      - "Status             : Ready for replication validation"
