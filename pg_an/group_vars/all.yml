---
###############################################
# Common
###############################################

ansible_become: true

postgres_service_name: postgresql

postgres_port: 5432

postgres_data_directory: "/var/lib/postgresql/{{ postgres_version }}/main"

###############################################
# Network
###############################################

listen_addr: "*"

max_connections: 200


###############################################
# Statistics
###############################################

shared_preload_libraries: "pg_stat_statements"
