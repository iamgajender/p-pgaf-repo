---
- hosts: all
  become: yes

  tasks:

    - name: Hostname
      command: hostname
      register: hostname_out
      changed_when: false

    - name: OS
      command: cat /etc/os-release
      register: os_out
      changed_when: false

    - name: PostgreSQL Version
      become_user: postgres
      command: psql --version
      register: pg_version
      changed_when: false

    - name: PostgreSQL Configuration
      become_user: postgres
      shell: |
        psql -At -c "
        SELECT name || '=' || setting
        FROM pg_settings
        WHERE name IN
        (
          'max_connections',
          'shared_buffers',
          'effective_cache_size',
          'work_mem',
          'maintenance_work_mem',
          'wal_level',
          'archive_mode',
          'listen_addresses'
        );"
      register: pg_settings
      changed_when: false

    - name: Save PostgreSQL summary on Ansible Controller
      copy:
        dest: /tmp/postgres_summary.json
        content: |
          {
            "hostname": "{{ hostname_out.stdout }}",
            "postgres_version": "{{ pg_version.stdout }}",
            "settings": [
            {% for item in pg_settings.stdout_lines %}
              "{{ item }}"{% if not loop.last %},{% endif %}
            {% endfor %}
            ]
          }
      delegate_to: localhost
      become: false
